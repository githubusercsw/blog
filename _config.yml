# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: "CSW 的思维角落"
subtitle: "关于技术、认知与生活的断想"
description: "一只程序员的笔记 —— AI、心理学与个人成长的交叉地带"
keywords: AI,心理学,编程,认知科学,个人成长
author: githubusercsw
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://example.com/child' and root as '/child/'
url: https://chenshengwu.dpdns.org
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your index page. (default = '')
# per_page: Posts displayed per page. (default = 10)
# order_by: Posts order. (default = -date)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & tag
default_category: 随笔
tag_map:
category_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

## Use post's date for updated date not mtime
use_date_for_updated: false

# Date / time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format by editing the following line
## https://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include_options: and exclude_options: are only present in Hexo 7.0.0+
## use_front_matter replaces the exclude_drafts and include options
exclude:
  - .DS_Store
  - Thumbs.db

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: landscape

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: https://github.com/githubusercsw/blog.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# Feed Generator (RSS/Atom)
feed:
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  hub:
  content:
  content_limit: 1400
  content_limit_excerpt: 360
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:
