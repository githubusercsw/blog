name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ============================================================
  # 构建与验证（PR 和 main push 都运行）
  # 五道质量门：依赖可复现 → 构建无错 → 产物完整 → 链接有效 → 产物可预览
  # ============================================================
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 门1：依赖可复现 — npm ci 严格按 package-lock.json，不一致即失败
      - name: 门1 - 依赖可复现（npm ci）
        run: npm ci

      # 门2：构建无错 — hexo generate 必须 exit 0，且日志无 ERROR/FATAL
      - name: 门2 - 构建无错
        run: |
          npx hexo generate 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::hexo generate 退出码非0"
            exit 1
          fi
          if grep -qiE "ERROR|FATAL" build.log; then
            echo "::error::构建日志包含 ERROR/FATAL"
            grep -iE "ERROR|FATAL" build.log
            exit 1
          fi
          echo "构建成功，无 ERROR/FATAL"

      # 门3：产物完整 — 关键文件必须存在，文章数必须 > 0
      - name: 门3 - 产物完整
        run: |
          REQUIRED_FILES=(
            "public/index.html"
            "public/atom.xml"
            "public/rss2.xml"
            "public/search.json"
            "public/about/index.html"
            "public/CNAME"
            "public/css/main.css"
          )
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺失关键文件: $f"
              MISSING=1
            else
              echo "✅ $f"
            fi
          done
          if [ $MISSING -ne 0 ]; then
            exit 1
          fi
          ARTICLE_COUNT=$(find public -type d -regextype posix-extended -regex ".*/20[0-9]{2}/[0-9]{2}/[0-9]{2}/[^/]+$" | wc -l)
          echo "构建文章数: $ARTICLE_COUNT"
          if [ "$ARTICLE_COUNT" -lt 1 ]; then
            echo "::error::文章数为0，构建可能异常"
            exit 1
          fi

      # 门4：链接有效 — htmltest 检查内部链接（外部链接跳过，避免网络波动）
      - name: 门4 - 链接有效（htmltest）
        uses: wjdp/htmltest-action@master
        with:
          config: .htmltest.yml

      # 门5：产物可预览 — 上传构建产物，PR 时可下载本地预览
      - name: 门5 - 上传构建产物（供预览/部署）
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public

  # ============================================================
  # 部署（仅 main 分支 push 时运行，PR 不部署）
  # ============================================================
  deploy:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: 部署到 gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
